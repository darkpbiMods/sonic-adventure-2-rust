[package]
autoexamples = false
name = "sonic-playground"
version = "0.44.1"
edition = "2024"
license = "MIT"

[dependencies]
macroquad = { version = "=0.4.16", optional = true, features = ["audio"] }
glam = "=0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sa2-runtime = { path = "../runtime" }

[features]
default = []
reference-tests = []
renderer = ["dep:macroquad"]

[[bin]]
name = "sonic-playground"
path = "src/main.rs"
required-features = ["renderer"]


[[bin]]
name = "verify-simulation"
path = "src/bin/verify_simulation.rs"
required-features = ["renderer"]




[[example]]
name = "headless"
path = "examples/headless.rs"

[[example]]
name = "pose"
path = "examples/pose.rs"
